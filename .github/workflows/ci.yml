name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GOWORK: "off" # grove is a standalone module with no workspace siblings
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: gofmt -l . | tee /dev/stderr | (! read)
      - run: go build ./...
      - run: go test -race ./...
